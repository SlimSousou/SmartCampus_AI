services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus}
      POSTGRES_USER: ${POSTGRES_USER:-smartcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcampus_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smartcampus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SMARTCAMPUS_APP_ENV: development
      SMARTCAMPUS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartcampus}:${POSTGRES_PASSWORD:-smartcampus_dev_only}@db:5432/${POSTGRES_DB:-smartcampus}
      SMARTCAMPUS_JWT_SECRET_KEY: ${SMARTCAMPUS_JWT_SECRET_KEY:-development-only-change-this-secret-before-deployment}
      SMARTCAMPUS_COOKIE_SECURE: "false"
      SMARTCAMPUS_AUTO_CREATE_TABLES: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartcampus-postgres: